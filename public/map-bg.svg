<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" preserveAspectRatio="xMidYMid slice">
  <rect width="600" height="800" fill="#e9f1ec"/>

  <!-- city blocks -->
  <g fill="#dbe7de">
    <rect x="24" y="24" width="150" height="120" rx="12"/>
    <rect x="194" y="24" width="156" height="120" rx="12"/>
    <rect x="370" y="24" width="206" height="120" rx="12"/>
    <rect x="24" y="178" width="150" height="172" rx="12"/>
    <rect x="370" y="178" width="206" height="172" rx="12"/>
    <rect x="24" y="420" width="150" height="160" rx="12"/>
    <rect x="370" y="420" width="206" height="160" rx="12"/>
    <rect x="24" y="616" width="250" height="160" rx="12"/>
    <rect x="370" y="616" width="206" height="160" rx="12"/>
  </g>

  <!-- parks -->
  <ellipse cx="290" cy="262" rx="66" ry="56" fill="#cfe6cd"/>
  <ellipse cx="290" cy="500" rx="86" ry="62" fill="#cfe6cd"/>
  <ellipse cx="120" cy="694" rx="64" ry="56" fill="#cfe6cd"/>
  <ellipse cx="480" cy="150" rx="54" ry="46" fill="#cfe6cd"/>

  <!-- water -->
  <path d="M 560 -20 C 520 150 630 260 545 430 C 480 560 610 640 560 820" fill="none" stroke="#c6e0f2" stroke-width="32" stroke-linecap="round"/>

  <!-- main roads -->
  <g stroke="#ffffff" stroke-width="18" stroke-linecap="round">
    <path d="M 182 0 L 182 800"/>
    <path d="M 362 0 L 362 800"/>
    <path d="M 0 152 L 600 152"/>
    <path d="M 0 398 L 600 398"/>
    <path d="M 0 598 L 600 598"/>
  </g>

  <!-- diagonal boulevard -->
  <path d="M 0 0 L 600 800" stroke="#ffffff" stroke-width="14" stroke-linecap="round" opacity="0.95"/>

  <!-- minor roads -->
  <g stroke="#ffffff" stroke-width="7" stroke-linecap="round" opacity="0.8">
    <path d="M 92 0 L 92 800"/>
    <path d="M 272 0 L 272 800"/>
    <path d="M 452 0 L 452 800"/>
    <path d="M 0 282 L 600 282"/>
    <path d="M 0 500 L 600 500"/>
    <path d="M 0 706 L 600 706"/>
  </g>
</svg>
