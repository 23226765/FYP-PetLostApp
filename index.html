<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fcf9f2" />
    <script>
      (() => {
        const key = 'pawradar_preferences_v1'
        const supported = ['en', 'zh-HK', 'zh-CN']
        let language = 'en'
        let theme = 'light'
        try {
          const saved = JSON.parse(localStorage.getItem(key) || '{}')
          const browser = navigator.language.toLowerCase()
          const hinted = browser.startsWith('zh-hk') || browser.startsWith('zh-tw') || browser.includes('hant')
            ? 'zh-HK'
            : browser.startsWith('zh-cn') || browser.startsWith('zh-sg') || browser.includes('hans')
              ? 'zh-CN'
              : 'en'
          language = supported.includes(saved.language) ? saved.language : hinted
          theme = ['light', 'dark'].includes(saved.theme) ? saved.theme : 'light'
        } catch {}
        document.documentElement.lang = language
        document.documentElement.dataset.theme = theme
        document.documentElement.style.colorScheme = theme
        document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#101817' : '#fcf9f2'
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet" />
    <title>PawRadar</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
